services:
  portfolio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "1000:1000"
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - /etc/letsencrypt/live/rdaigre.fr/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - /etc/letsencrypt/live/rdaigre.fr/privkey.pem:/etc/ssl/private/privkey.pem
    security_opt:
      - no-new-privileges:true
